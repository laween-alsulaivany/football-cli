name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel --no-deps --wheel-dir dist .

      - name: Install dependencies
        run: python -m pip install -e . pytest pytest-cov

      - name: Run tests
        run: python -m pytest tests --cov=config --cov-report=term-missing --cov-report=html

      - name: Check method coverage
        run: python scripts/check_method_coverage.py
